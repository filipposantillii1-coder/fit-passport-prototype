<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fit Passport · The Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#D9F005; --ink:#0B0B0C; --grey:#59595C; --beige:#CFCCC1;
  --paper:#F5F4EF; --card:#FFFFFF; --line:#E3E1D9; --red:#C00000; --red-soft:#F8E1E1;
  --muted:#8A8A8D; --radius:12px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--ink);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
aside .brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 6px}
aside .brand img{width:92px}
aside .brand .prod{font-weight:700;font-size:15px;letter-spacing:-.01em}
aside .brand .sub{font-size:11px;color:var(--beige);opacity:.8}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:#D8D7D2;font-size:13.5px;font-weight:500}
nav button .n{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:#1F1F21;color:var(--beige);flex:none}
nav button:hover{background:#18181A;color:#fff}
nav button.on{background:var(--lime);color:var(--ink)}
nav button.on .n{background:var(--ink);color:var(--lime)}
nav .sep{height:1px;background:#222;margin:8px 4px}
aside .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 6px}
main{padding:0 0 60px;min-width:0}
.top{position:sticky;top:0;z-index:5;background:rgba(245,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0 auto 0 0;letter-spacing:-.015em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--lime);color:var(--ink);white-space:nowrap}
.pill.dark{background:var(--ink);color:var(--lime)}
.pill.warn{background:var(--red-soft);color:var(--red)}
.pill.demo{background:#FFF4CF;color:#6B4E00;border:1px solid #E5C35C}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--grey)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:4px 10px 4px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--grey);display:flex;align-items:center;gap:7px}
.seg button img{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:top}
.seg button.on{background:var(--ink);color:#fff}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey)}
select,input[type=text],input[type=number],input[type=date],textarea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--ink);color:#fff}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.wrap{padding:24px 28px;max-width:1280px}
.lede{color:var(--grey);margin:0 0 18px;max-width:820px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g32{grid-template-columns:3fr 2fr}.g23{grid-template-columns:2fr 3fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:15px;margin:0 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.clean li{padding-left:16px;position:relative}
ul.clean li:before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--lime);outline:1px solid var(--ink)}
.idhead{display:flex;gap:18px;align-items:center}
.photo{width:84px;height:108px;border-radius:12px;object-fit:cover;object-position:top;background:var(--ink);border:2px solid var(--lime);flex:none}
.photo.sm{width:40px;height:40px;border-radius:50%;border-width:1.5px}
.idhead .nm{font-size:26px;font-weight:800;letter-spacing:-.02em}
.idhead .meta{color:var(--grey);font-size:13px}
.quote{border-left:3px solid var(--lime);padding:6px 0 6px 14px;font-size:14px;color:var(--ink);font-style:italic}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:600}
.stat .l{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #EFEDE6;vertical-align:top}
tr:last-child td{border-bottom:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;letter-spacing:.03em;white-space:nowrap}
.PASS{background:var(--ink);color:var(--lime)}
.FAIL{background:var(--red);color:#fff}
.OPEN{background:#EFEEE8;color:var(--grey);border:1px dashed #A9A699}
.WEAK{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.RISK{background:#FFE9A8;color:#6B4E00}
.rec{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px}
.rec.go{background:var(--lime);color:var(--ink)}
.rec.hold{background:#FFE9A8;color:#5A4300}
.rec.no{background:var(--red);color:#fff}
.funnel{display:flex;flex-direction:column;gap:8px}
.gate{display:grid;grid-template-columns:34px 1fr 130px;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff}
.gate .ix{font-family:var(--mono);font-weight:700;color:var(--grey)}
.gate .t{font-weight:700}
.gate .r{font-size:12.5px;color:var(--grey);margin-top:2px}
.gate .s{font-size:11.5px;color:#6B4E00;margin-top:3px}
.gate.dead{opacity:.35;filter:grayscale(1)}
.gate.failrow{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.gate.passrow{box-shadow:inset 4px 0 0 var(--ink)}
.gate.unkrow{box-shadow:inset 4px 0 0 #A9A699}
.order{display:flex;flex-direction:column;gap:6px}
.order .o{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.order .o b{font-family:var(--mono);width:18px}
.order .o span{flex:1}
.order .o input{width:52px}
.bar{height:10px;border-radius:5px;background:#EFEEE8;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:5px}
.range{position:relative;height:26px;background:#F1F0EA;border-radius:6px}
.range .band{position:absolute;top:5px;bottom:5px;background:var(--lime);border:1px solid var(--ink);border-radius:4px}
.range .mid{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.range .tick{position:absolute;top:100%;font-family:var(--mono);font-size:10px;color:var(--muted);transform:translateX(-50%);margin-top:2px}
.big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none}
.toggle input{accent-color:var(--ink);width:16px;height:16px}
.callout{border:1px solid var(--line);border-left:4px solid var(--ink);background:#fff;border-radius:10px;padding:12px 14px;font-size:13px}
.callout.warn{border-left-color:var(--red)}
.callout.demo{border-left-color:#E5C35C;background:#FFFBEA}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.test{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #EFEDE6}
.test:last-child{border-bottom:none}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.ok{color:#2B6B00;font-weight:700}.ko{color:var(--red);font-weight:700}
.demorow{background:repeating-linear-gradient(-45deg,transparent,transparent 8px,#FFFBEA 8px,#FFFBEA 16px)}
.err{color:var(--red);font-size:12px;margin-top:4px}
.scoreSel{min-width:116px}
.anchor{font-size:11px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0;position:relative;margin-left:6px}
.tl .e{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:7px 0 7px 16px;border-left:2px solid var(--line);position:relative;font-size:12.5px}
.tl .e:before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--grey)}
.tl .e.key{font-weight:700}
.tl .e.key:before{background:var(--lime);border-color:var(--ink)}
.tl .d{font-family:var(--mono);color:var(--muted);font-size:11.5px}
.tl .f{font-family:var(--mono);font-size:11.5px;color:var(--grey);text-align:right}
nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7C7B7F;padding:12px 10px 4px;font-weight:700}
tr.rowsel td{background:#FBFCE6}
tr.faded td{opacity:.5}
#addForm label,#poolObsForm label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
#addForm input,#addForm select{width:100%}
.kpi .big{font-size:26px}
#print{display:none}
@media (max-width:980px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.g2,.g3,.g4,.g32,.g23{grid-template-columns:1fr}.gate{grid-template-columns:28px 1fr}.gate>div:last-child{grid-column:2}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  .app{display:none}
  #print{display:block;font-size:11px}
  #print .ph{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .ph img.logo{width:54px}
  #print .ph .photo{width:54px;height:68px}
  #print h1{font-size:18px;margin:0}
  #print .card{padding:10px 12px;break-inside:avoid}
  #print .grid{gap:8px;margin-top:8px}
  #print .g2{grid-template-columns:1fr 1fr !important}
  #print .kv{font-size:11px;gap:3px 12px}
  #print td{padding:5px 6px}
  #print ul.clean{gap:3px}
  .chip,.rec,.range .band,.pill,.photo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

/* ============ HELPERS ============ */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LABEL={PASS:'PASS',FAIL:'FAIL',OPEN:'OPEN',WEAK:'PASS · WEAK',RISK:'PASS · AT RISK'};
const chip=s=>`<span class="chip ${s}">${LABEL[s]}</span>`;

function gateOf(club,g){const base=CLUBS[club].gates[g];const e=(S.gateEdits[club]||{})[g];return e?{...base,s:e,edited:true}:base;}
function scoreOf(club,c){const e=(S.scoreEdits[club]||{})[c];return e!==undefined?e:CLUBS[club].scores[c][0];}
function obsCount(k){return (S.obs[k]||[]).length;}
function gateView(club,g){const x=gateOf(club,g);if(x.s!=='PASS')return x.s;
 if(x.risk)return 'RISK';
 if(g==='SL')return obsCount(CLUBS[club].case)>=3?'PASS':'WEAK';
 if(x.ev==='agent')return 'WEAK';
 return 'PASS';}
function recommend(club){const st=BASE_ORDER.map(g=>gateView(club,g));
 if(st.includes('FAIL'))return {k:'no',t:'Reject',d:'nogo'};
 if(st.includes('OPEN'))return {k:'hold',t:'Hold: open checks',d:'nogo'};
 if(st.includes('RISK'))return {k:'hold',t:'Hold: acceptance risk',d:'nogo'};
 if(st.includes('WEAK'))return {k:'go',t:'Proceed: weak evidence',d:'go'};
 return {k:'go',t:'Proceed',d:'go'};}
function weights(){const w=Object.fromEntries(CRITERIA.map(c=>[c.id,c.w]));if(S.sens.shift){w.CD-=5;w.PF+=5;}return w;}
function scoreRange(get){const w=weights();let lo=0,hi=0,ev=0;for(const c of CRITERIA){const v=get(c.id);if(v==null){lo+=w[c.id];hi+=w[c.id]*5;}else{lo+=w[c.id]*v;hi+=w[c.id]*v;ev+=w[c.id];}}return {lo:lo/100,hi:hi/100,mid:(lo+hi)/200,ev};}
function evidenceStrength(list){const m=new Set(list.map(o=>o.date+'|'+o.match)).size;const o=new Set(list.map(o=>o.type+':'+(o.who||''))).size;
 const lvl=m===0?'None':(m>=5&&o>=2)?'Strong':(m>=3&&o>=2)?'Moderate':'Weak';return {m,o,lvl};}
function rangeBar(r){const p=v=>(v/5*100).toFixed(1)+'%';return `<div class="range"><div class="band" style="left:${p(r.lo)};width:calc(${p(r.hi)} - ${p(r.lo)} + 3px)"></div><div class="mid" style="left:${p(r.mid)}"></div>${[0,1,2,3,4,5].map(t=>`<span class="tick" style="left:${t*20}%">${t}</span>`).join('')}</div>`;}
const fmt=n=>n.toFixed(2);
const scoreTxt=r=>r.lo===r.hi?fmt(r.lo):fmt(r.lo)+' – '+fmt(r.hi);

/* ============ 3 FIT CHECK ============ */
function runPair(statusFn,order){let checks=0,effort=0,stop=null;for(const g of order){checks++;effort+=+S.effort[g]||0;if(statusFn(g)==='FAIL'){stop=g;break;}}return {checks,effort,stop};}
function perms(a){if(a.length<=1)return [a];return a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));}
function poolCost(order){let c=0,e=0;const surv=[];for(const p of ORDER_POOL){const r=runPair(g=>evalSyn(p,ORDER_REQ,g).s,order);c+=r.checks;e+=r.effort;if(!r.stop)surv.push(p.id);}return {c,e,surv:surv.join(',')};}
function vFit(){const k=S.case,club=S.club;let dead=false;const rows=S.order.map((g,i)=>{const x=gateOf(club,g),v=gateView(club,g);const cls=dead?'dead':v==='FAIL'?'failrow':v==='OPEN'?'unkrow':'passrow';const out=`<div class="gate ${cls}"><div class="ix">${i+1}</div><div><div class="t">${GMAP[g].name} ${x.edited?'<span class="pill ghost">edited</span>':''}</div><div class="r">${esc(x.r)}</div>${x.risk?`<div class="s"><b>Risk:</b> ${esc(x.risk)}</div>`:''}${v==='WEAK'&&g==='SL'?`<div class="s">Fewer than 3 viewings logged.</div>`:''}</div><div style="text-align:right">${dead?'<span class="muted small">not reached</span>':chip(v)}<div style="margin-top:6px"><select data-gate="${g}">${['PASS','FAIL','OPEN'].map(s=>`<option ${x.s===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div>`;if(v==='FAIL')dead=true;return out;}).join('');
 const rec=recommend(club),pair=runPair(g=>gateOf(club,g).s,S.order);
 const all=perms(BASE_ORDER).map(o=>({o,...poolCost(o)}));const best=all.reduce((a,b)=>b.e<a.e?b:a);const worst=all.reduce((a,b)=>b.e>a.e?b:a);
 const orders=[['Standard order',BASE_ORDER],['Level & wage first',HINT_ORDER],['Current order',S.order],['Cheapest of 120 orders',best.o]];
 const sameSurv=new Set(all.map(x=>x.surv)).size===1;
 return `<p class="lede">Five pass/fail gates. One FAIL stops the funnel. An open check never counts as a pass. Change any status to test a what-if.</p>
 <div class="grid g32"><div class="grid" style="align-content:start"><div class="card"><div class="row" style="margin-bottom:12px">${photo(k,'sm')}<h3 style="margin:0">${esc(CASES[k].name)} → ${esc(CLUBS[club].name)}</h3><span class="sp"></span><span class="rec ${rec.k}">${rec.t}</span></div><div class="funnel">${rows}</div>
  <div class="row small muted" style="margin-top:12px">This pair: ${pair.checks} checks, ${pair.effort} effort units${pair.stop?' (stopped at '+GMAP[pair.stop].name+')':''}. <span class="sp"></span><button class="btn ghost sm" data-act="resetGates">Reset</button></div></div>
  <div class="card"><h2>Legend</h2><div class="row small">${chip('PASS')} evidenced ${chip('WEAK')} agent view only or fewer than 3 viewings ${chip('RISK')} acceptance risk ${chip('OPEN')} check still open ${chip('FAIL')} stops the funnel</div></div></div>
 <div class="grid" style="align-content:start"><div class="card"><h2>Gate order</h2><div class="order">${S.order.map((g,i)=>`<div class="o"><b>${i+1}</b><span>${GMAP[g].name}</span><input type="number" min="0" data-eff="${g}" value="${S.effort[g]}" title="${GMAP[g].effortWhy}"><button class="btn ghost sm" data-up="${i}" ${i?'':'disabled'}>↑</button><button class="btn ghost sm" data-down="${i}" ${i<4?'':'disabled'}>↓</button></div>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-preset="base">Standard</button><button class="btn ghost sm" data-preset="hint">Level & wage first</button><button class="btn ghost sm" data-preset="best">Cheapest</button></div><div class="anchor" style="margin-top:8px">Effort units per gate (editable): ${GATES.map(g=>g.id+' '+g.effortWhy.toLowerCase()).join(' · ')}.</div></div>
  <div class="card"><h2>Cost of each order <span class="pill demo">Demo pool · 8 players</span></h2>
   ${orders.map(([l,o])=>{const r=poolCost(o);return `<div style="margin-bottom:10px"><div class="row small"><b>${l}</b><span class="sp"></span><span class="mono">${r.c} checks · ${r.e} units</span></div><div class="muted small mono">${o.join(' › ')}</div><div class="bar" style="margin-top:4px"><i style="width:${(r.e/worst.e*100).toFixed(0)}%"></i></div></div>`;}).join('')}
   <div class="callout" style="margin-top:8px">${sameSurv?'<b>The same players pass in all 120 orders.</b> The order changes the effort, not the result.':'Survivors differ across orders: check edits.'} Range: ${best.e} to ${worst.e} units. Credibility is protected by any order, as long as no proposal goes out before all five gates are checked.</div></div></div></div>`;}

/* ============ 4 SCORECARD ============ */
function vScore(){const k=S.case,clubs=CASES[k].clubs;
 const ranges=clubs.map(cl=>({cl,...scoreRange(c=>scoreOf(cl,c))}));
 const leader=ranges.reduce((a,b)=>b.lo>a.lo?b:a);
 const lowered=S.sens.lower?CRITERIA.filter(c=>scoreOf(leader.cl,c.id)!=null).sort((a,b)=>b.w-a.w).slice(0,2).map(c=>c.id):null;
 const eff=(cl,c)=>{const v=scoreOf(cl,c);if(v==null)return null;return lowered&&cl===leader.cl&&lowered.includes(c)?Math.max(1,v-2):v;};
 const R=clubs.map(cl=>({cl,...scoreRange(c=>eff(cl,c))}));const newLeader=R.reduce((a,b)=>b.lo>a.lo?b:a);const w=weights();
 return `<p class="lede">Six weighted criteria, scored 1, 3 or 5 (2 and 4 in between). The weighted score runs from 0 to 5. Edit any score to see the effect.</p>

 <div class="grid" style="align-content:start"><div class="card"><h2>Weighted score (0-5)</h2>${R.map(r=>`<div style="margin-bottom:26px"><div class="row"><b>${esc(CLUBS[r.cl].name)}</b><span class="sp"></span><span class="mono" style="font-size:18px;font-weight:600">${scoreTxt(r)}</span></div><div style="margin-top:6px">${rangeBar(r)}</div></div>`).join('')}
  ${clubs.length>1?`<div class="callout">Leader: <b>${esc(CLUBS[newLeader.cl].name)}</b>. Gap: ${fmt(Math.abs(R[0].lo-R[1].lo))} points. ${Math.abs(R[0].lo-R[1].lo)<0.2?'Too close to call on the score alone: the decision rests on player preference.':''}</div>`:`<div class="callout">One club assessed for this player. Rodríguez has two offers side by side.</div>`}</div>
 <div class="card"><h2>Sensitivity</h2><label class="toggle"><input type="checkbox" data-sens="shift" ${S.sens.shift?'checked':''}> Shift 5 points from Career Development to Preference</label><div style="height:8px"></div><label class="toggle"><input type="checkbox" data-sens="lower" ${S.sens.lower?'checked':''}> Lower the leader's two heaviest scores by one anchor step (−2)</label>
 ${(S.sens.shift||S.sens.lower)&&clubs.length>1?`<div class="small" style="margin-top:10px">${newLeader.cl===leader.cl&&!S.sens.shift?'Leader unchanged.':'Leader under this test: <b>'+esc(CLUBS[newLeader.cl].name)+'</b>.'}</div>`:''}</div></div></div>`;}

/* ============ 5 DECISION ============ */
function decOf(club){const c=CLUBS[club].case;if(S.dec[club])return S.dec[club];return CLUBS[club].primary?{choice:'Proceed',rationale:CASES[c].hist,oneUp:false,oneUpWhy:''}:{choice:'',rationale:'',oneUp:false,oneUpWhy:''};}

 const override=d.choice&&map[d.choice]!==rec.d;const errs=[];if(d.choice&&!String(d.rationale).trim())errs.push('Rationale is required.');if(d.oneUp&&!String(d.oneUpWhy).trim())errs.push('One-level-up exception needs a documented reason.');

/* ============ 6 CASE REVIEW ============ */
function reviewRows(){return Object.keys(CASES).map(k=>{const club=CASES[k].clubs[0];const rec=recommend(club);const r=scoreRange(c=>scoreOf(club,c));return {k,club,rec,r,match:rec.d===CASES[k].dir,trail:BASE_ORDER.map(g=>gateView(club,g))};});}

 const flagged=[];for(const cl of Object.keys(CLUBS))for(const g of BASE_ORDER){const x=gateOf(cl,g);if((x.s==='FAIL'||x.s==='OPEN')&&!x.r)flagged.push(cl+'/'+g);}
 const logged=rows.filter(r=>!r.match).every(r=>DIVERGENCES.some(d=>d.case.includes(r.k)));

 <div class="grid g2" style="margin-bottom:16px"><div class="card"><h2>Test thresholds</h2>

/* ============ GATES FOR DATABASE PROFILES ============ */
function evalSyn(p,q,g){
 if(g==='PN'){if(p.role!==q.role)return {s:'FAIL',r:`Plays ${p.role}, request is ${q.role}`};if(q.foot!=='Any'&&p.foot!==q.foot)return {s:'FAIL',r:`${p.foot}-footed, request is ${q.foot}`};if(q.maxAge&&p.age!=null&&p.age>q.maxAge)return {s:'FAIL',r:`Age ${p.age}, request is ${q.maxAge} or younger`};return {s:'PASS',r:'Role, foot and age match'};}
 if(g==='TR'){if(p.contract==null)return {s:'OPEN',r:'Contract status to check'};if(p.contract==='fee'&&!q.fee)return {s:'FAIL',r:'Needs a transfer fee; request is free/loan only'};return {s:'PASS',r:p.contract==='free'?'Free / expiring':'Fee route allowed'};}
 if(g==='PA'){const a=p.accept[q.country];if(!a)return {s:'OPEN',r:`Not yet asked about ${q.country}`};return a==='yes'?{s:'PASS',r:`Open to ${q.country}`}:{s:'FAIL',r:`Rejects ${q.country}`};}
 if(g==='SL'){if(p.level==null)return {s:'OPEN',r:'Level not yet assessed'};const d=p.level-q.level;if(d<=0)return {s:'PASS',r:d<0?'Above requested level':'At requested level'};if(d===1&&p.exc)return {s:'PASS',r:'One level below: exceptional-prospect exception'};return {s:'FAIL',r:d===1?'One level below: credibility risk':'Two+ levels below'};}
 if(g==='FF'){if(p.wage==null)return {s:'OPEN',r:'Wage expectation to check'};return p.wage<=q.maxWage?{s:'PASS',r:`€${p.wage}K ≤ €${q.maxWage}K`}:{s:'FAIL',r:`€${p.wage}K > €${q.maxWage}K`};}}
const allPool=()=>[...POOL,...S.added];
const findP=id=>allPool().find(p=>p.id===id);
const pname=p=>p.name||p.id;
const daysSince=d=>Math.max(0,Math.round((TODAY-new Date(d))/864e5));
const ago=d=>d==null?'—':d<1?'today':d<45?d+' days ago':Math.round(d/30.4)+' months ago';
const fmtD=d=>{try{return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}};
function liveObs(p){const ex=S.poolObs[p.id]||[];const all=[...(p.notes||[]),...ex];const m=p.obs.m+ex.length;
 const named=new Set(all.map(e=>String(e.who||'').trim().toLowerCase()).filter(Boolean)).size;const o=Math.max(p.obs.o,named);
 const ds=all.map(e=>daysSince(e.date));if(p.obs.days!=null)ds.push(p.obs.days);const days=ds.length?Math.min(...ds):null;
 const lvl=m===0?'None':(m>=5&&o>=2)?'Strong':(m>=3&&o>=2)?'Moderate':'Weak';return {m,o,days,lvl,stale:days!=null&&days>180,all};}
const stPill=p=>p.status==='rep'?'<span class="pill dark">Represented</span>':'<span class="pill">Scouted · not represented</span>';
const srcTag=p=>p.added?'<span class="pill ghost" style="font-size:9px;padding:1px 5px">ADDED</span>':'<span class="pill demo" style="font-size:9px;padding:1px 5px">DEMO</span>';
const contractTxt=p=>p.contract==='free'?(p.exp&&p.exp!=='—'?'Expires '+p.exp:'Expiring / free'):p.contract==='fee'?'Until '+p.exp+' (fee)':'To check';
const ROLES=['Centre-back','Left-back','Centre-forward','Attacking midfield'];
const opt=(arr,v)=>arr.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('');

 const nStale=pool.filter(x=>x.stale).length;

  ${cases.map(k=>{const c=CASES[k];return `<tr><td><div class="row" style="gap:8px;flex-wrap:nowrap">${photo(k,'sm')}<div><b>${esc(c.name)}</b><div style="margin-top:3px"><span class="pill ghost">Case file · past deal</span></div></div></div></td><td>${esc(c.pos)}<div class="small muted">${esc(c.foot)} foot · ${c.ageNow}</div></td><td class="small">${esc(c.now.club)}<div class="muted">${esc(c.now.status)}</div></td><td class="small">${c.now.contract!=='—'?'Until '+esc(c.now.contract):'—'}</td><td class="mono">—</td><td class="small">—</td><td class="small">${evidenceStrength(S.obs[k]||[]).lvl}<div class="muted">${obsCount(k)} matches</div></td><td><button class="btn ghost sm" data-openpass="${k}">Passport</button></td></tr>`;}).join('')}
  </table>${rows.length+cases.length?'':'<div class="small muted" style="padding:12px 0">No profiles match this filter.</div>'}

 <div class="row" style="margin-top:14px">${p.status==='scout'?(done?'<span class="pill">Approach logged</span>':`<button class="btn lime" data-pact="${p.id}">Propose representation</button>`):(done?'<span class="pill">Proposal prepared</span>':`<button class="btn" data-pact="${p.id}">Prepare proposal</button>`)}<button class="btn ghost" data-tab="request">Run a club request</button></div></div>`;}

function vRequest(){const q=S.req;const res=allPool().map(p=>{const gs=Object.fromEntries(BASE_ORDER.map(g=>[g,evalSyn(p,q,g)]));const run=runPair(g=>gs[g].s,S.order);const fail=BASE_ORDER.some(g=>gs[g].s==='FAIL');const unk=BASE_ORDER.filter(g=>gs[g].s==='OPEN').length;const r=scoreRange(c=>p.sc[c]);return {p,gs,run,fail,unk,r,lo:liveObs(p)};});
 res.sort((a,b)=>(a.fail-b.fail)||(a.unk-b.unk)||(b.r.mid-a.r.mid));
 const pass=res.filter(x=>!x.fail&&!x.unk);const passScout=pass.filter(x=>x.p.status==='scout');const passStale=pass.filter(x=>x.lo.stale).length;
 const stoppedLW=res.filter(x=>['SL','FF'].includes(x.run.stop)).length;
 return `<div class="callout demo" style="margin-bottom:16px"><b>Searches the whole scouting database:</b> represented players and players scouted but not represented. DEMO profiles are synthetic; profiles you add are searched too.</div>
 <p class="lede">A club asks for a profile. Every active profile goes through the five gates in the current order, then is ranked by players who pass, fewest open checks, and score.</p>
 <div class="grid g23"><div class="grid" style="align-content:start"><div class="card"><h2>Club request</h2><dl class="kv" style="align-items:center">
  <dt>Role</dt><dd><select data-req="role">${opt(ROLES,q.role)}</select></dd>
  <dt>Foot</dt><dd><select data-req="foot">${opt(['Any','Left','Right'],q.foot)}</select></dd>
  <dt>Max age</dt><dd><input type="number" data-req="maxAge" value="${q.maxAge??''}" style="width:70px"></dd>
  <dt>Level</dt><dd><select data-req="level">${LEVELS.map((l,i)=>`<option value="${i}" ${i==q.level?'selected':''}>${l}</option>`).join('')}</select></dd>
  <dt>Country</dt><dd><select data-req="country">${opt(['Italy','Other Europe','Gulf'],q.country)}</select></dd>
  <dt>Max wage</dt><dd><input type="number" data-req="maxWage" value="${q.maxWage}" style="width:90px"> €K/yr</dd>
  <dt>Fee allowed</dt><dd><input type="checkbox" data-req="fee" ${q.fee?'checked':''}></dd></dl></div>
  <div class="card"><h2>Run summary</h2><dl class="kv"><dt>Profiles screened</dt><dd>${res.length}</dd><dt>Pass all gates</dt><dd>${pass.length}</dd><dt>Of which not represented</dt><dd>${passScout.length}</dd><dt>Of which need a re-watch</dt><dd>${passStale}</dd><dt>Stopped by level/wage</dt><dd>${stoppedLW}</dd></dl></div>
  ${passScout.length?`<div class="callout"><b>${passScout.length} of ${pass.length}</b> players who pass are not represented by The Talent. Without the scouting database they would not be on this shortlist.</div>`:''}</div>
 <div class="card"><h2>Shortlist</h2><table><tr><th>#</th><th>Player</th><th>Gates</th><th>Evidence</th><th>Score</th><th></th></tr>${res.map((x,i)=>{const done=S.actions[x.p.id];const ok=!x.fail&&!x.unk;
  const act=ok?(x.p.status==='scout'?(done?'<span class="pill">Approach logged</span>':`<button class="btn lime sm" data-pact="${x.p.id}">Propose representation</button>`):(done?'<span class="pill">Proposal prepared</span>':`<button class="btn sm" data-pact="${x.p.id}">Prepare proposal</button>`)):(!x.fail?`<button class="btn ghost sm" data-sel="${x.p.id}">Complete profile</button>`:'');
  return `<tr class="${x.fail?'faded':''} ${x.p.added?'':'demorow'}"><td class="mono">${i+1}</td><td><b>${esc(pname(x.p))}</b> ${srcTag(x.p)}<div class="small muted">${esc(x.p.role)}, ${esc(x.p.foot)}, ${x.p.age??'—'}${x.p.exc?' · exceptional prospect':''}</div><div style="margin-top:3px">${stPill(x.p)}</div></td><td>${S.order.map(g=>`<span class="chip ${x.gs[g].s}" title="${GMAP[g].name}: ${esc(x.gs[g].r)}">${g}</span>`).join(' ')}<div class="small muted" style="margin-top:3px">${x.fail?esc(BASE_ORDER.map(g=>x.gs[g]).find(y=>y.s==='FAIL').r):x.unk?x.unk+' open check(s)':x.gs.SL.r.includes('exception')?'Passes via one-level-up exception: documented reason required':'All gates passed'}</div></td><td class="small">${x.lo.lvl}<div class="muted">${x.lo.m} matches · seen ${ago(x.lo.days)}</div>${x.lo.stale?'<div style="margin-top:3px"><span class="pill warn">Re-watch</span></div>':''}</td><td class="mono">${x.fail?'<span class="muted">—</span>':scoreTxt(x.r)}</td><td>${act}</td></tr>`;}).join('')}</table></div></div>`;}

function csv(){const rows=[['section','id','player','club','passport','gates','score','match/type','detail']];
 for(const r of reviewRows())rows.push(['case review',r.k,CASES[r.k].name,CLUBS[r.club].name,r.rec.t,r.trail.join(' '),scoreTxt(r.r),r.match?'match':'miss',CASES[r.k].lesson]);

const VIEWS={db:vDb,passport:vPassport,club:vClub,fit:vFit,score:vScore,decision:vDecision,retro:vRetro,request:vRequest};
function render(){if(!VIEWS[S.tab])S.tab='db';if(!CASES[S.case].clubs.includes(S.club))S.club=CASES[S.case].clubs[0];chrome();document.getElementById('view').innerHTML=VIEWS[S.tab]();save();}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const ds=t.dataset;
 if(ds.tab){S.tab=ds.tab;history.replaceState(null,'','#tab='+ds.tab);render();window.scrollTo(0,0);}
 else if(ds.case){S.case=ds.case;S.club=CASES[ds.case].clubs[0];render();}
 else if(ds.up){const i=+ds.up;[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]];render();}
 else if(ds.down){const i=+ds.down;[S.order[i+1],S.order[i]]=[S.order[i],S.order[i+1]];render();}
 else if(ds.preset){S.order=ds.preset==='base'?[...BASE_ORDER]:ds.preset==='hint'?[...HINT_ORDER]:perms(BASE_ORDER).map(o=>({o,...poolCost(o)})).reduce((a,b)=>b.e<a.e?b:a).o.slice();render();}
 else if(ds.choice){S.dec[S.club]={...decOf(S.club),choice:ds.choice};render();}
 else if(ds.delobs!==undefined){S.obs[S.case].splice(+ds.delobs,1);render();}
 else if(ds.sel){S.sel=ds.sel;if(S.tab!=='db'){S.tab='db';history.replaceState(null,'','#tab=db');window.scrollTo(0,0);}render();}
 else if(ds.openpass){S.case=ds.openpass;S.club=CASES[ds.openpass].clubs[0];S.tab='passport';history.replaceState(null,'','#tab=passport');render();window.scrollTo(0,0);}
 else if(ds.dbf){S.dbf=ds.dbf;render();}
 else if(ds.pact){S.actions[ds.pact]=new Date().toISOString().slice(0,10);render();}
 else if(ds.act==='toggleAdd'){S.showAdd=!S.showAdd;render();}
 else if(ds.act==='print'){buildPrint();window.print();}
 else if(ds.act==='csv')csv();
 else if(ds.act==='resetGates'){delete S.gateEdits[S.club];render();}
});
document.addEventListener('change',e=>{const t=e.target,ds=t.dataset;
 if(ds.clubsel!==undefined){S.club=t.value;render();}
 else if(ds.dbrole!==undefined){S.dbrole=t.value;render();}
 else if(ds.gate){(S.gateEdits[S.club]=S.gateEdits[S.club]||{})[ds.gate]=t.value;if(t.value===CLUBS[S.club].gates[ds.gate].s)delete S.gateEdits[S.club][ds.gate];render();}
 else if(ds.score){const [cl,c]=ds.score.split('|');(S.scoreEdits[cl]=S.scoreEdits[cl]||{})[c]=t.value===''?null:+t.value;render();}
 else if(ds.sens){S.sens[ds.sens]=t.checked;render();}
 else if(ds.eff){S.effort[ds.eff]=Math.max(0,+t.value||0);render();}
 else if(ds.req){S.req[ds.req]=t.type==='checkbox'?t.checked:(ds.req==='level'||ds.req==='maxWage'||ds.req==='maxAge')?(t.value===''?null:+t.value):t.value;render();}
 else if(ds.dec){const d={...decOf(S.club)};d[ds.dec]=t.type==='checkbox'?t.checked:t.value;S.dec[S.club]=d;render();}
});
document.addEventListener('submit',e=>{const id=e.target.id;if(!['obsForm','poolObsForm','addForm'].includes(id))return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 if(id==='obsForm'){S.obs[S.case].push(f);}
 else if(id==='poolObsForm'){(S.poolObs[S.sel]=S.poolObs[S.sel]||[]).push(f);}
 else{const pid='N'+Date.now().toString(36);S.added.push({id:pid,name:f.name,added:true,status:f.status,role:f.role,foot:f.foot,age:f.age===''?null:+f.age,level:f.level===''?null:+f.level,exc:false,contract:f.contract||null,exp:f.exp||'—',accept:f.italy?{Italy:f.italy}:{},wage:f.wage===''?null:+f.wage,mv:f.mv||'—',nat:f.nat||'—',club:f.club||'—',note:f.note||'New profile.',obs:{m:1,o:1,days:null},sc:{PT:null,CD:null,TF:null,PF:null,FU:null,SC:null},notes:[{date:f.date,match:f.match,who:f.who,rating:f.rating,note:f.note}]});S.sel=pid;S.showAdd=false;}
 render();});
window.addEventListener('beforeprint',buildPrint);
render();buildPrint();
</script>
</body>
</html>
